packages:
  - apps/*
  # apps/gsd is a vendored, self-contained monorepo (the GSD/Kan app: its own
  # pnpm-workspace, lockfile, and Next.js/tRPC/drizzle stack). Keep it out of
  # the root workspace so its nested packages and conflicting deps don't merge
  # into Reflect's graph — it installs and builds on its own.
  - '!apps/gsd'
  - packages/*
  - design-system

allowBuilds:
  '@sentry/cli': true
  better-sqlite3: true
  esbuild: true
  spawn-sync: true

dedupePeers: true

ignoreWorkspaceRootCheck: true

minimumReleaseAgeExclude:
  - '@meowdown/*'
  - '@prosekit/*'
  - '@aria-ui/*'
  - prosemirror-flat-list
  - prosemirror-view
  - '@floating-ui/core@1.8.0'
  - '@floating-ui/dom@1.8.0'
  - '@floating-ui/utils@0.2.12'
  - prosemirror-model@1.25.11

# overrides:
#   '@meowdown/core': https://pkg.pr.new/prosekit/meowdown/@meowdown/core@623bc43
#   '@meowdown/react': https://pkg.pr.new/prosekit/meowdown/@meowdown/react@623bc43
# blockExoticSubdeps: false
