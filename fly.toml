# Fly.io config for the Reflect graph server (fork addition).
# The graph (markdown + git repo) and server state live on the volume.

app = "reflect-jakebrowne91"
primary_region = "lhr"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "reflect_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
