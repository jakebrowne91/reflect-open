# Fly.io config for the Reflect graph server (fork addition).
# The graph (markdown + git repo) and server state live on the volume.

app = "reflect-jakebrowne91"
primary_region = "lhr"

[http_service]
  internal_port = 8787
  force_https = true
  # The server runs background timers — the git-backup debounce and the GSD
  # sync poll — so it must NOT suspend on idle: a suspended machine freezes
  # those timers, and a note edit would never get committed/pushed or synced
  # until the next inbound request happened to wake it. Keep one always up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "reflect_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
