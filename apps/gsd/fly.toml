app = "reflect-gsd-jakebrowne91"
primary_region = "lhr"

[build]
  dockerfile = "apps/web/Dockerfile"
  build-target = "web"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine warm so the board never pays a cold-start on load.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
